<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Jaromes Lite: a little helper that lives on your screen">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14061c"/>
      <stop offset="0.55" stop-color="#2a0b3a"/>
      <stop offset="1" stop-color="#3d0d3a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff78d6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff78d6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ff9be3" opacity="0.12"/>
    </pattern>
    <pattern id="led" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect x="1" y="1" width="11" height="11" rx="1.5" fill="#ffb3ea"/>
    </pattern>
    <clipPath id="face"><circle cx="230" cy="190" r="112"/></clipPath>
  </defs>
  <rect width="1200" height="380" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="380" rx="28" fill="url(#dots)"/>
  <circle cx="230" cy="190" r="170" fill="url(#glow)"/>
  <!-- the pixel buddy -->
  <g clip-path="url(#face)">
    <rect x="110" y="70" width="240" height="240" fill="url(#led)"/>
    <rect x="110" y="250" width="240" height="70" fill="#2a0b3a" opacity="0.55"/>
  </g>
  <g fill="#3b0f45">
    <rect x="183" y="168" width="12" height="12"/><rect x="195" y="156" width="12" height="12"/><rect x="207" y="168" width="12" height="12"/>
    <rect x="241" y="168" width="12" height="12"/><rect x="253" y="156" width="12" height="12"/><rect x="265" y="168" width="12" height="12"/>
    <rect x="211" y="214" width="12" height="12"/><rect x="223" y="222" width="14" height="10"/><rect x="237" y="214" width="12" height="12"/>
  </g>
  <rect x="166" y="194" width="18" height="10" rx="3" fill="#ff5fc8" opacity="0.6"/>
  <rect x="276" y="194" width="18" height="10" rx="3" fill="#ff5fc8" opacity="0.6"/>
  <!-- speech bubble -->
  <g transform="translate(330 70)">
    <rect width="190" height="54" rx="14" fill="#ffffff" opacity="0.95"/>
    <path d="M18 54 L8 72 L38 54 Z" fill="#ffffff" opacity="0.95"/>
    <text x="95" y="34" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#5a1663">Hi! Ready? ✨</text>
  </g>
  <!-- title -->
  <text x="560" y="170" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="78" font-weight="800" fill="#ffe8f8" letter-spacing="2">Jaromes Lite</text>
  <text x="564" y="220" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" fill="#ffa8e5">Your little study buddy that lives on your screen</text>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="600">
    <rect x="564" y="252" width="118" height="40" rx="20" fill="#ff78d6" opacity="0.18" stroke="#ff78d6"/>
    <text x="623" y="278" text-anchor="middle" fill="#ffd1f1">🎙 Talk</text>
    <rect x="694" y="252" width="128" height="40" rx="20" fill="#ff78d6" opacity="0.18" stroke="#ff78d6"/>
    <text x="758" y="278" text-anchor="middle" fill="#ffd1f1">📚 Study</text>
    <rect x="834" y="252" width="150" height="40" rx="20" fill="#ff78d6" opacity="0.18" stroke="#ff78d6"/>
    <text x="909" y="278" text-anchor="middle" fill="#ffd1f1">⏰ Reminders</text>
    <rect x="996" y="252" width="140" height="40" rx="20" fill="#ff78d6" opacity="0.18" stroke="#ff78d6"/>
    <text x="1066" y="278" text-anchor="middle" fill="#ffd1f1">🤖 Agents</text>
  </g>
  <text x="564" y="330" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#d8b4cd">Created by Vansh Bohra</text>
</svg>
